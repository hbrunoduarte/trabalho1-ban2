<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Imobiliária | Login</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="app-login">
        <barra-superior></barra-superior>
        <div class="area-login">
            <h1 class="titulo">Realize seu login</h1>
            <div class="container-login-cadastro">
                <div class="caixa-login">
                    <div class="login-botoes">
                        <button class="login-tipo-botao" :class="{'login-tipo-botao-ativo': isInquilino}" @click="isInquilino = true">Inquilino</button>
                        <button class="login-tipo-botao" :class="{'login-tipo-botao-ativo': !(isInquilino)}" @click="isInquilino = false">Proprietário</button>
                    </div>
                    <div>
                        <form class="login-input" @submit.prevent="enviarDados">
                            <input-box
                                label="Identificação:"
                                placeholder="Digite seu e-mail"
                                v-model="loginForm.login"
                                :erro="errosForm.login">
                            </input-box>
                            <input-box
                                label="Senha:"
                                type="password"
                                placeholder="Digite sua senha"
                                v-model="loginForm.senha"
                                :erro="errosForm.senha">
                            </input-box>
                            <button type="submit" class="submit-login">
                                <svg class="icone-login" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M16.642 20.669c-0.391 0.39-0.391 1.023-0 1.414 0.195 0.195 0.451 0.293 0.707 0.293s0.512-0.098 0.707-0.293l5.907-6.063-5.907-6.063c-0.39-0.39-1.023-0.39-1.414 0s-0.391 1.024 0 1.414l3.617 3.617h-19.264c-0.552 0-1 0.448-1 1s0.448 1 1 1h19.326zM30.005 0h-18c-1.105 0-2.001 0.895-2.001 2v9h2.014v-7.78c0-0.668 0.542-1.21 1.21-1.21h15.522c0.669 0 1.21 0.542 1.21 1.21l0.032 25.572c0 0.668-0.541 1.21-1.21 1.21h-15.553c-0.668 0-1.21-0.542-1.21-1.21v-7.824l-2.014 0.003v9.030c0 1.105 0.896 2 2.001 2h18c1.105 0 2-0.895 2-2v-28c-0.001-1.105-0.896-2-2-2z"></path>
                                </svg>
                                <span>Realizar login</span>
                            </button>
                        </form>
                    </div>
                </div>
                <p class="login-texto-cadastro">Não possui conta? Cadastre-se <a class="login-link-cadastro" href="/cadastro">aqui</a>.</p>
            </div>
        </div>
        <barra-inferior></barra-inferior>
    </div>

<script type="module" th:inline="javascript">

import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
import BarraSuperior from '/components/BarraSuperior.js'
import BarraInferior from '/components/BarraInferior.js'
import InputBox from '/components/InputBox.js'

createApp({
components: {
    BarraSuperior,
    BarraInferior,
    InputBox
},
setup() {
    const isInquilino = ref(true)

    const loginForm = ref({
        email: '',
        senha: ''
    })

    const errosForm = ref({})
    const mensagemServer = ref('')

    async function enviarDados() {

        try {

            const response = await fetch('http://localhost:8080/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(loginForm.value) 
            })

            if (!response.ok) {
                const erros = await response.json()
                console.log("Erros retornados:", erros)
                errosForm.value = {
                    login: erros.login,
                    senha: erros.senha
                }
                return
            }

            // Se passou (Status 200 OK), lemos a mensagem de sucesso
            const textoSucesso = await response.text()
            mensagemServer.value = textoSucesso
            
            loginForm.value = { email: '', senha: '' }
            errosForm.value = {}

        } catch (error) {
            console.error("Erro na rede:", error)
            mensagemServer.value = "Servidor indisponível."
        }
    }

    return {
        isInquilino,
        loginForm,
        errosForm,
        mensagemServer,
        enviarDados
    }

}
}).mount('#app-login');
</script>
</body>
</html>
