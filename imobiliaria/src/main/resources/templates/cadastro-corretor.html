<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Imobiliária | Cadastro de Corretor</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="app-cadastro">
        <barra-superior></barra-superior>
        <div class="box-cadastro">
            <div class="box-cadastro-titulo">
                <h1 class="cadastro-titulo">Cadastro de Corretor</h1>
            </div>
            <div class="area-cadastro">
                <form class="cadastro-input" @submit.prevent="enviarDados">

                    <input-box
                        label="Nome completo"
                        placeholder="Digite o nome do corretor"
                        v-model="form.nome"
                        :erro="errosForm.nome"
                    ></input-box>

                    <input-box
                        label="CPF"
                        placeholder="Digite o CPF"
                        v-model="form.cpf"
                        :erro="errosForm.cpf"
                    ></input-box>

                    <div class="cadastro-endereco-dados">
                        <input-box
                            label="CRECI"
                            placeholder="Digite o número do CRECI"
                            v-model="form.creci"
                            :erro="errosForm.creci"
                        ></input-box>
                        <input-box
                            label="Telefone"
                            placeholder="Digite o telefone"
                            v-model="form.telefone"
                            :erro="errosForm.telefone"
                        ></input-box>
                    </div>

                    <div class="cadastro-endereco-dados">
                        <input-box
                            label="Percentual de comissão (%)"
                            placeholder="Ex.: 5 ou 5,5"
                            v-model="form.percentualComissao"
                            :erro="errosForm.percentualComissao"
                        ></input-box>
                        <input-box
                            label="Data de admissão"
                            type="date"
                            v-model="form.dataAdmissao"
                            :erro="errosForm.dataAdmissao"
                        ></input-box>
                    </div>

                    <input-box
                        label="E-mail"
                        placeholder="Digite o e-mail"
                        v-model="form.email"
                        :erro="errosForm.email"
                    ></input-box>

                    <input-box
                        label="Senha"
                        type="password"
                        placeholder="Digite a senha"
                        v-model="form.senha"
                        :erro="errosForm.senha"
                    ></input-box>

                    <p v-show="errosForm.geral" class="login-input-invalido">{{ errosForm.geral }}</p>

                    <button type="submit" class="submit-login" :disabled="enviando">
                        <svg class="icone-login" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16.642 20.669c-0.391 0.39-0.391 1.023-0 1.414 0.195 0.195 0.451 0.293 0.707 0.293s0.512-0.098 0.707-0.293l5.907-6.063-5.907-6.063c-0.39-0.39-1.023-0.39-1.414 0s-0.391 1.024 0 1.414l3.617 3.617h-19.264c-0.552 0-1 0.448-1 1s0.448 1 1 1h19.326zM30.005 0h-18c-1.105 0-2.001 0.895-2.001 2v9h2.014v-7.78c0-0.668 0.542-1.21 1.21-1.21h15.522c0.669 0 1.21 0.542 1.21 1.21l0.032 25.572c0 0.668-0.541 1.21-1.21 1.21h-15.553c-0.668 0-1.21-0.542-1.21-1.21v-7.824l-2.014 0.003v9.030c0 1.105 0.896 2 2.001 2h18c1.105 0 2-0.895 2-2v-28c-0.001-1.105-0.896-2-2-2z"></path>
                        </svg>
                        <span>{{ enviando ? 'Cadastrando...' : 'Realizar cadastro' }}</span>
                    </button>
                </form>
            </div>
        </div>
        <barra-inferior></barra-inferior>
    </div>

<script type="module" th:inline="javascript">

import { createApp, ref } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
import BarraSuperior from '/components/BarraSuperior.js'
import BarraInferior from '/components/BarraInferior.js'
import InputBox from '/components/InputBox.js'

createApp({
components: {
    BarraSuperior,
    BarraInferior,
    InputBox
},
setup() {

    const form = ref({
        nome: '',
        email: '',
        senha: '',
        telefone: '',
        cpf: '',
        percentualComissao: '',
        dataAdmissao: '',
        creci: ''
    })

    const errosForm = ref({})
    const enviando = ref(false)

    const CHAVES_VISIVEIS = /^(nome|email|senha|telefone|cpf|percentualComissao|dataAdmissao|creci|geral)$/;

    function traduzirErros(erros) {
        const traduzidos = {};
        for (const [chave, mensagem] of Object.entries(erros)) {
            const destino = CHAVES_VISIVEIS.test(chave) ? chave : 'geral';
            if (!traduzidos[destino]) traduzidos[destino] = mensagem;
            else if (destino === 'geral') traduzidos.geral += ' ' + mensagem;
        }
        return traduzidos;
    }

    async function lerErros(response) {
        try {
            return traduzirErros(await response.json());
        } catch {
            return { geral: 'Ocorreu um erro inesperado. Tente novamente mais tarde.' };
        }
    }

    function percentualParaFracao(texto) {
        const numero = parseFloat(String(texto).trim().replace(',', '.'));
        return Number.isNaN(numero) ? null : Number((numero / 100).toFixed(6));
    }

    async function enviarDados() {
        errosForm.value = {};
        enviando.value = true;

        try {
            const f = form.value;
            const payload = {
                nome: f.nome.trim(),
                email: f.email.trim(),
                senha: f.senha,
                telefone: f.telefone.trim(),
                cpf: f.cpf.replace(/\D/g, ''),
                percentualComissao: percentualParaFracao(f.percentualComissao),
                dataAdmissao: f.dataAdmissao || null,
                creci: f.creci.trim()
            };

            const response = await fetch('/api/corretores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                errosForm.value = await lerErros(response);
                alert('Erro no cadastro, verifique os campos.');
                return;
            }

            alert('Cadastro realizado com sucesso!');
            window.location.href = '/login';

        } catch (error) {
            console.error('Erro na rede:', error);
            errosForm.value = { geral: 'Servidor indisponível. Verifique sua conexão e tente novamente.' };
        } finally {
            enviando.value = false;
        }
    }

    return {
        form,
        errosForm,
        enviando,
        enviarDados
    }

}
}).mount('#app-cadastro');
</script>
</body>
</html>
