<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Imobiliária | Cadastro</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div id="app-cadastro">
        <barra-superior></barra-superior>
        <div class="box-cadastro">
            <div class="box-cadastro-titulo">
                <h1 class="cadastro-titulo">Cadastro de Usuário</h1>
            </div>
            <div class="area-cadastro">
                <form class="cadastro-input" @submit.prevent="enviarDados">
                    <div class="cadastro-tipo">                    
                        <label class="cadastro-label">Tipo de cadastro</label><br>
                        <div class="seletor-tipocadastro">
                            <input type="radio" id="op_cliente" v-model="cadastroForm.isCliente" :value="true">
                            <label class="cadastro-opcoes" for="op_cliente">Cliente</label>
                            <br>
                            <input type="radio" id="op_proprietario" v-model="cadastroForm.isCliente" :value="false">
                            <label class="cadastro-opcoes" for="op_proprietario">Proprietário</label>
                        </div>
                    </div>
                    <input-box
                        label="Nome completo"
                        placeholder="Digite seu nome"
                        v-model="cadastroForm.nome"
                        :erro="errosForm.nome"
                    ></input-box>
                    <input-box
                        :label="cadastroForm.isCliente ? 'CPF' : 'CPF ou CNPJ'"
                        :placeholder="cadastroForm.isCliente ? 'Digite seu CPF' : 'Digite seu CPF ou CNPJ'"
                        v-model="cadastroForm.cpf_cnpj"
                        :erro="errosForm.cpf_cnpj"
                    ></input-box>
                    <input-box v-if="cadastroForm.isCliente"
                        label="Profissão"
                        placeholder="Digite o nome da sua profissão"
                        v-model="cadastroForm.profissao"
                        :erro="errosForm.profissao"
                    ></input-box>
                    <input-box v-if="cadastroForm.isCliente"
                        label="Renda mensal (R$)"
                        placeholder="Digite sua renda (apenas números)"
                        v-model="cadastroForm.rendaMensal"
                        :erro="errosForm.rendaMensal"
                    ></input-box>
                    <div class="cadastro-box-dados-bancarios" v-if="!cadastroForm.isCliente && cadastroForm.dadosBancarios !== null">                    
                        <label class="cadastro-label">Dados bancários</label>
                        <div class="cadastro-bancario">
                            <div class="cadastro-dados-bancarios">                                            
                                <div class="cadastro-db-agencia-conta">
                                    <input-box
                                        label="Número da agência"
                                        placeholder="Número da agência"
                                        v-model="cadastroForm.dadosBancarios.agencia"
                                        :erro="errosForm['dadosBancarios.agencia']"
                                    ></input-box>
                                    <input-box
                                        label="Número da conta"
                                        placeholder="Número da conta"
                                        v-model="cadastroForm.dadosBancarios.conta"
                                        :erro="errosForm['dadosBancarios.conta']"
                                    ></input-box>
                                </div>
                                <div class="cadastro-db-dv-tipoconta">                        
                                    <input-box
                                        label="Dígito verificador"
                                        placeholder="Dígito verificador"
                                        v-model="cadastroForm.dadosBancarios.dv"
                                        :erro="errosForm['dadosBancarios.dv']"
                                    ></input-box>
                                    <div class="cadastro-tipoconta">
                                        <label class="cadastro-label">Tipo de conta</label><br>
                                        <div>                                    
                                            <input type="radio" id="op_corrente" v-model="cadastroForm.dadosBancarios.isCorrente" :value="true">
                                            <label class="cadastro-opcoes" for="op_corrente">Corrente</label>
                                            <br>
                                            <input type="radio" id="op_poupanca" v-model="cadastroForm.dadosBancarios.isCorrente" :value="false">
                                            <label class="cadastro-opcoes" for="op_poupanca">Poupança</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="box-seletor-banco">
                                <label class="cadastro-label">Banco</label>                        
                                <div class="seletor-banco">
                                    <input type="radio" id="banco1" v-model="cadastroForm.dadosBancarios.banco" :value="0">
                                    <label for="banco1">
                                        <img th:src="@{/img/bancos/bb.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 0}" alt="Banco do Brasil S.A.">
                                    </label>

                                    <input type="radio" id="banco2" v-model="cadastroForm.dadosBancarios.banco" :value="1">
                                    <label for="banco2">
                                        <img th:src="@{/img/bancos/santander.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 1}" alt="Banco Santander S.A.">
                                    </label>

                                    <input type="radio" id="banco3" v-model="cadastroForm.dadosBancarios.banco" :value="2">
                                    <label for="banco3">
                                        <img th:src="@{/img/bancos/inter.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 2}" alt="Banco Inter S.A.">
                                    </label>

                                    <input type="radio" id="banco4" v-model="cadastroForm.dadosBancarios.banco" :value="3">
                                    <label for="banco4">
                                        <img th:src="@{/img/bancos/caixa.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 3}" alt="Caixa Econômica Federal">
                                    </label>

                                    <input type="radio" id="banco5" v-model="cadastroForm.dadosBancarios.banco" :value="4">
                                    <label for="banco5">
                                        <img th:src="@{/img/bancos/bradesco.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 4}" alt="Banco Bradesco S.A.">
                                    </label>

                                    <input type="radio" id="banco6" v-model="cadastroForm.dadosBancarios.banco" :value="5">
                                    <label for="banco6">
                                        <img th:src="@{/img/bancos/nubank.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 5}" alt="Nu Pagamentos S.A.">
                                    </label>

                                    <input type="radio" id="banco7" v-model="cadastroForm.dadosBancarios.banco" :value="6">
                                    <label for="banco7">
                                        <img th:src="@{/img/bancos/itau.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 6}" alt="Itaú Unibanco S.A.">
                                    </label>

                                    <input type="radio" id="banco8" v-model="cadastroForm.dadosBancarios.banco" :value="7">
                                    <label for="banco8">
                                        <img th:src="@{/img/bancos/c6bank.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 7}" alt="Banco C6 S.A.">
                                    </label>

                                    <input type="radio" id="banco9" v-model="cadastroForm.dadosBancarios.banco" :value="8">
                                    <label for="banco9">
                                        <img th:src="@{/img/bancos/sicoob.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 8}" alt="Sicoob">
                                    </label>

                                    <input type="radio" id="banco10" v-model="cadastroForm.dadosBancarios.banco" :value="9">
                                    <label for="banco10">
                                        <img th:src="@{/img/bancos/sicredi.png}" :class="{'seletor-banco-escolhido': cadastroForm.dadosBancarios.banco == 9}" alt="Banco Cooperativo Sicredi S.A.">
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <label class="cadastro-label">Telefones</label>                        
                    <div class="box-cadastro-telefones">
                        <div class="cadastro-telefones" v-for="(telefone, index) in cadastroForm.telefones" :key="index">
                            <div class="cadastro-telefones-dados">                        
                                <input-box
                                    :label="'Telefone ' + (index + 1)"
                                    placeholder="Digite seu telefone"
                                    v-model="cadastroForm.telefones[index]"
                                    :erro="errosForm[`telefones[${index}]`]"
                                ></input-box>
                                <button class="remover-telefone" type="button" v-if="cadastroForm.telefones.length > 1" @click="removerTelefone(index)">
                                    Remover
                                </button>
                            </div>
                        </div>
                        <button class="add-telefone" type="button" @click="adicionarTelefone" v-if="cadastroForm.telefones.length < 3">
                            + Adicionar outro telefone
                        </button>
                    </div>
                    <div class="box-cadastro-tipo-imoveis" v-if="cadastroForm.isCliente">
                        <label class="cadastro-label">Por qual tipo de imóvel você procura?</label>
                        <div class="cadastro-tipo-imoveis">
                            <div v-for="tipo in tiposImoveis" :key="tipo.idTipoImovel" class="opcao-tipo-imovel">
                                <input 
                                type="radio" 
                                :id="'tipo_' + tipo.idTipoImovel" 
                                :value="tipo.idTipoImovel" 
                                v-model="cadastroForm.tipoImovel"
                                >
                                <label class="cadastro-opcoes" :for="'tipo_' + tipo.idTipoImovel">
                                    {{ tipo.descricao }}
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="box-cadastro-endereco" v-if="!cadastroForm.isCliente && cadastroForm.endereco !== null">
                        <label class="cadastro-label">Endereço</label>
                        <div class="cadastro-endereco">
                            <div class="cadastro-endereco-dados">
                                <input-box
                                    label="Rua"
                                    placeholder="Nome da rua"
                                    v-model="cadastroForm.endereco.rua"
                                    :erro="errosForm['endereco.rua']"
                                ></input-box>
                                <input-box
                                    label="Número da residência"
                                    placeholder="Número da residência"
                                    v-model="cadastroForm.endereco.numero"
                                    :erro="errosForm['endereco.numero']"
                                ></input-box>
                                <input-box
                                    label="Bairro"
                                    placeholder="Nome do bairro"
                                    v-model="cadastroForm.endereco.bairro"
                                    :erro="errosForm['endereco.bairro']"
                                ></input-box>
                                <input-box
                                    label="Complemento"
                                    placeholder="Escreva um complemento"
                                    v-model="cadastroForm.endereco.complemento"
                                    :erro="errosForm['endereco.complemento']"
                                ></input-box>
                            </div>
                            <div class="cadastro-endereco-dados">
                                <input-box
                                    label="Cidade"
                                    placeholder="Nome da cidade"
                                    v-model="cadastroForm.endereco.cidade"
                                    :erro="errosForm['endereco.cidade']"
                                ></input-box>
                                <input-box
                                    label="Estado"
                                    placeholder="Sigla do estado"
                                    v-model="cadastroForm.endereco.estado"
                                    :erro="errosForm['endereco.estado']"
                                ></input-box>
                                <input-box
                                    label="CEP"
                                    placeholder="Digite seu CEP"
                                    v-model="cadastroForm.endereco.cep"
                                    :erro="errosForm['endereco.cep']"
                                ></input-box>
                            </div>
                        </div>
                    </div>
                    <input-box
                        label="E-mail"
                        placeholder="Digite seu e-mail"
                        v-model="cadastroForm.email"
                        :erro="errosForm.email"
                    ></input-box>
                    <input-box
                        label="Senha"
                        type="password"
                        placeholder="Digite sua senha"
                        v-model="cadastroForm.senha"
                        :erro="errosForm.senha"
                    ></input-box>
                    <button type="submit" class="submit-login">
                        <svg class="icone-login" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16.642 20.669c-0.391 0.39-0.391 1.023-0 1.414 0.195 0.195 0.451 0.293 0.707 0.293s0.512-0.098 0.707-0.293l5.907-6.063-5.907-6.063c-0.39-0.39-1.023-0.39-1.414 0s-0.391 1.024 0 1.414l3.617 3.617h-19.264c-0.552 0-1 0.448-1 1s0.448 1 1 1h19.326zM30.005 0h-18c-1.105 0-2.001 0.895-2.001 2v9h2.014v-7.78c0-0.668 0.542-1.21 1.21-1.21h15.522c0.669 0 1.21 0.542 1.21 1.21l0.032 25.572c0 0.668-0.541 1.21-1.21 1.21h-15.553c-0.668 0-1.21-0.542-1.21-1.21v-7.824l-2.014 0.003v9.030c0 1.105 0.896 2 2.001 2h18c1.105 0 2-0.895 2-2v-28c-0.001-1.105-0.896-2-2-2z"></path>
                        </svg>
                        <span>{{ enviando ? 'Cadastrando...' : 'Realizar cadastro'}}</span>
                    </button>
                </form>
            </div>
        </div>
        <barra-inferior></barra-inferior>
    </div>

<script type="module" th:inline="javascript">

import { createApp, ref, watch, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
import BarraSuperior from '/components/BarraSuperior.js'
import BarraInferior from '/components/BarraInferior.js'
import InputBox from '/components/InputBox.js'

createApp({
components: {
    BarraSuperior,
    BarraInferior,
    InputBox
},
setup() {

    const enviando = ref(false)

    const cadastroForm = ref({
        isCliente: true,
        nome: '',
        cpf_cnpj: '',
        profissao: '',
        rendaMensal: '',
        dadosBancarios: null,
        telefones: [''],
        endereco: null,
        tipoImovel: 0,
        email: '',
        senha: ''
    })

    const errosForm = ref({})
    const mensagemServer = ref('')

    const tiposImoveis = ref([])

    watch(() => cadastroForm.value.isCliente,
        (isClienteAgora) => {
            errosForm.value = {};
            cadastroForm.value.telefones = [''];
            cadastroForm.value.tipoImovel = 0;

            if (isClienteAgora === true) {
                cadastroForm.value.dadosBancarios = null;
                cadastroForm.value.endereco = null;
            } else {
                cadastroForm.value.endereco = {
                    rua: '',
                    numero: '',
                    bairro: '',
                    complemento: '',
                    cidade: '',
                    estado: '',
                    cep: ''
                };
                cadastroForm.value.dadosBancarios = {
                    agencia: '',
                    conta: '',
                    dv: '',
                    isCorrente: true,
                    banco: 0
                };
            }
        }
    )

    const adicionarTelefone = () => {
        if (cadastroForm.value.telefones.length < 3) {
            cadastroForm.value.telefones.push('');
        }
    }

    const removerTelefone = (index) => {
        cadastroForm.value.telefones.splice(index, 1);
    }

    async function getTiposImoveis() {
        const resTiposImoveis = await fetch('/api/imoveis/tipos');
        tiposImoveis.value = await resTiposImoveis.json();
        console.log(tiposImoveis.value);
    }

    onMounted(() => {
        getTiposImoveis();
    });

    const CHAVES_SERVIDOR = {
        cpf: 'cpf_cnpj',
        cnpj: 'cpf_cnpj',
        razaoSocial: 'nome',
        tipoInteressado: 'tipoImovel',
        agencia: 'dadosBancarios.agencia',
        conta: 'dadosBancarios.conta',
        dv: 'dadosBancarios.dv',
        telefones: 'telefones[0]'
    };
    const CHAVES_VISIVEIS = /^(nome|profissao|rendaMensal|email|senha|cpf_cnpj|tipoImovel|geral|dadosBancarios\.\w+|telefones\[\d+\]|endereco\.\w+)$/;

    function traduzirErros(erros, prefixo = '') {
        const traduzidos = {};
        for (const [chave, mensagem] of Object.entries(erros)) {
            const destino = chave === 'geral' ? 'geral' : prefixo + (CHAVES_SERVIDOR[chave] ?? chave);
            const chaveFinal = CHAVES_VISIVEIS.test(destino) ? destino : 'geral';
            if (!traduzidos[chaveFinal]) traduzidos[chaveFinal] = mensagem;
            else if (chaveFinal === 'geral') traduzidos.geral += ' ' + mensagem;
        }
        return traduzidos;
    }

    async function lerErros(response, prefixo = '') {
        try {
            return traduzirErros(await response.json(), prefixo);
        } catch {
            return { geral: 'Ocorreu um erro inesperado. Tente novamente mais tarde.' };
        }
    }

    async function enviarDados() {

        enviando.value = true

        try {
            let endpoint = '';
            let payload = {};

            const telefones = cadastroForm.value.telefones;
            const docLimpo = cadastroForm.value.cpf_cnpj.replace(/\D/g, '');

            if (cadastroForm.value.isCliente) {
                endpoint = '/api/clientes';
                payload = {
                    rendaMensal: cadastroForm.value.rendaMensal,
                    profissao: cadastroForm.value.profissao,
                    tipoInteressado: cadastroForm.value.tipoImovel,
                    cpf: docLimpo,
                    email: cadastroForm.value.email,
                    senha: cadastroForm.value.senha,
                    nome: cadastroForm.value.nome,
                    telefones
                };
            } else {
                endpoint = '/api/proprietarios';

                const enderecoPayload = {
                    cep: cadastroForm.value.endereco.cep.replace(/\D/g, ''),
                    estado: cadastroForm.value.endereco.estado,
                    cidade: cadastroForm.value.endereco.cidade,
                    bairro: cadastroForm.value.endereco.bairro,
                    rua: cadastroForm.value.endereco.rua,
                    numero: parseInt(cadastroForm.value.endereco.numero) || null,
                    complemento: cadastroForm.value.endereco.complemento
                };

                const isPJ = docLimpo.length > 11;
                const db = cadastroForm.value.dadosBancarios;

                payload = {
                    tipo: isPJ ? 'J' : 'F',
                    cpf: !isPJ ? docLimpo : null,
                    cnpj: isPJ ? docLimpo : null,
                    email: cadastroForm.value.email,
                    senha: cadastroForm.value.senha,
                    banco: db.banco,
                    agencia: db.agencia,
                    conta: db.conta,
                    dv: db.dv,
                    nome: !isPJ ? cadastroForm.value.nome : null,
                    razaoSocial: isPJ ? cadastroForm.value.nome : null,
                    telefones
                };

                const resEndereco = await fetch('/api/enderecos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(enderecoPayload)
                });

                if (!resEndereco.ok) {
                    const errosEndereco = await lerErros(resEndereco, 'endereco.');
                    let errosProprietario = {};

                    if (resEndereco.status === 400) {
                        const resValidacao = await fetch('/api/proprietarios/validar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!resValidacao.ok) {
                            errosProprietario = await lerErros(resValidacao);
                        }
                    }

                    errosForm.value = { ...errosProprietario, ...errosEndereco };
                    enviando.value = false
                    alert('Erro no cadastro, verifique os campos.');
                    return;
                }

                const enderecoSalvo = await resEndereco.json();
                payload.idEndereco = enderecoSalvo.idEndereco;
            }

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                errosForm.value = await lerErros(response);
                enviando.value = false
                alert('Erro no cadastro, verifique os campos.');
                return;
            }

            enviando.value = false
            alert("Cadastro realizado com sucesso!");
            errosForm.value = {};
            window.location.href = "/login"; // Redireciona para o login após sucesso

        } catch (error) {
            console.error("Erro na rede:", error);
            errosForm.value = { geral: 'Servidor indisponível. Verifique sua conexão e tente novamente.' };
        }
    }

    return {
        enviando,
        cadastroForm,
        errosForm,
        mensagemServer,
        tiposImoveis,
        adicionarTelefone,
        removerTelefone,
        enviarDados
    }

}
}).mount('#app-cadastro');
</script>
</body>
</html>
